<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Herkes çiçek alır... Ben senin için kodladım.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0014;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Üst yazı */
    .top-text {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      text-align: center;
      color: #fff;
      z-index: 20;
      text-shadow: 0 0 12px rgba(255, 80, 140, 0.9);
      font-size: clamp(15px, 4.2vw, 24px);
      line-height: 1.45;
      font-weight: 500;
      pointer-events: none;
    }

    .top-text span {
      display: block;
    }

    /* Kalp alanı */
    #heart {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .love {
      position: absolute;
      color: #ff2d6a;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      text-shadow: 0 0 6px #ff2d6a, 0 0 12px #ff0066;
      opacity: 0.8;
      animation: pulse 2.8s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
      will-change: transform, opacity;
    }

    /* Ortadaki isim */
    .center-name {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 15;
      pointer-events: none;
    }

    .center-name .name {
      font-size: clamp(28px, 9vw, 52px);
      font-weight: 800;
      color: #fff;
      letter-spacing: 3px;
      text-shadow: 
        0 0 18px #ff2d6a,
        0 0 36px #ff0066,
        0 0 55px #cc0044;
      animation: glow 2.2s ease-in-out infinite alternate;
    }

    .center-name .sub {
      display: block;
      margin-top: 6px;
      font-size: clamp(11px, 3.2vw, 15px);
      font-weight: 400;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 10px rgba(255, 80, 140, 0.7);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 16px #ff2d6a, 0 0 32px #ff0066;
      }
      to {
        text-shadow: 0 0 26px #ff2d6a, 0 0 50px #ff0066, 0 0 70px #cc0044;
      }
    }

    /* Çok küçük ekranlar için ekstra ayar */
    @media (max-height: 600px) {
      .top-text {
        top: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="top-text">
    <span>Herkes çiçek alır...</span>
    <span>Ben senin için kodladım.</span>
  </div>

  <div id="heart"></div>

  <div class="center-name">
    <div class="name">NAZ</div>
    <div class="sub">senin için</div>
  </div>

  <script>
    const heart = document.getElementById('heart');
    const texts = ['I LOVE YOU', 'I LOVE YOU', 'LOVE', '❤'];

    // Kalp formülü
    function heartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    // Ekran boyutuna göre ölçek
    function getScale() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const minSide = Math.min(w, h);
      return Math.max(7.5, Math.min(14, minSide / 55));
    }

    function createHeart() {
      heart.innerHTML = '';
      const scale = getScale();
      const count = window.innerWidth < 500 ? 180 : 260; // telefonda biraz daha az

      for (let i = 0; i < count; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t);
        const r = 0.55 + Math.random() * 0.55;

        const x = p.x * scale * r;
        const y = p.y * scale * r;

        const el = document.createElement('div');
        el.className = 'love';
        el.textContent = texts[Math.floor(Math.random() * texts.length)];

        el.style.left = `calc(50% + ${x}px)`;
        el.style.top  = `calc(50% + ${y}px)`;
        el.style.transform = `translate(-50%, -50%) rotate(${(Math.random() - 0.5) * 35}deg)`;
        el.style.fontSize = (8 + Math.random() * 5) + 'px';
        el.style.animationDelay = (Math.random() * 2.5) + 's';
        el.style.opacity = 0.5 + Math.random() * 0.5;

        const hue = 335 + Math.random() * 35;
        el.style.color = `hsl(${hue}, 100%, 62%)`;
        el.style.textShadow = `0 0 7px hsl(${hue}, 100%, 50%)`;

        heart.appendChild(el);
      }
    }

    createHeart();

    // Ekran boyutu değişince (telefon çevirme vs.) yeniden çiz
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(createHeart, 200);
    });

    // İsim değiştirmek istersen burayı düzenle:
    // document.querySelector('.name').textContent = 'YENİ İSİM';
  </script>
</body>
</html>
