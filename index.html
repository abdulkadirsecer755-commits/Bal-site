<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESİLA - Seni Seviyorum</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050005;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Sol Üst Köşe: Sonsuzluk ve Kalp */
    .top-left-icon {
      position: absolute;
      top: 25px;
      left: 25px;
      font-size: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      color: #ff2a75;
      text-shadow: 0 0 10px #ff2a75, 0 0 20px #ff2a75;
      animation: glow 2s infinite alternate;
    }

    /* Ana Konteyner ve Sonsuz Atan Kalp Animasyonu */
    .heart-container {
      position: relative;
      width: 600px;
      height: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: heartbeat 1.2s infinite ease-in-out;
    }

    @keyframes heartbeat {
      0% {
        transform: scale(1);
      }
      14% {
        transform: scale(1.08);
      }
      28% {
        transform: scale(1);
      }
      42% {
        transform: scale(1.08);
      }
      70% {
        transform: scale(1);
      }
    }

    /* Canvas: Kalp çizgisini oluşturan yazılar */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Kalbin Ortasındaki ESİLA Yazısı */
    .center-text {
      position: absolute;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }

    .center-text h1 {
      font-size: 64px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 4px;
      text-shadow: 
        0 0 10px #ff2a75,
        0 0 20px #ff2a75,
        0 0 30px #ff2a75,
        0 0 40px #ff0055;
      animation: pulseText 2s infinite alternate;
    }

    .center-text p {
      font-size: 16px;
      color: #ff99bb;
      margin-top: 5px;
      letter-spacing: 2px;
      text-shadow: 0 0 5px #ff2a75;
    }

    @keyframes pulseText {
      from {
        text-shadow: 0 0 10px #ff2a75, 0 0 20px #ff2a75, 0 0 30px #ff2a75;
      }
      to {
        text-shadow: 0 0 15px #ff6699, 0 0 30px #ff2a75, 0 0 45px #ff0055, 0 0 60px #ff0055;
      }
    }

    /* Alt Kısım: Kalp Ritmi (EKG) Çizgisi */
    .ecg-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      overflow: hidden;
      z-index: 2;
    }

    .ecg-svg {
      width: 100%;
      height: 100%;
    }

    .ecg-line {
      fill: none;
      stroke: #ff2a75;
      stroke-width: 3;
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      animation: ecgDraw 3s linear infinite;
      filter: drop-shadow(0px 0px 8px #ff2a75);
    }

    @keyframes ecgDraw {
      0% {
        stroke-dashoffset: 2000;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes glow {
      from {
        opacity: 0.8;
        filter: drop-shadow(0 0 5px #ff2a75);
      }
      to {
        opacity: 1;
        filter: drop-shadow(0 0 15px #ff2a75);
      }
    }
  </style>
</head>
<body>

  <!-- Sol Üst: Sonsuzluk İşareti ve Kalp -->
  <div class="top-left-icon">
    <span>&#8734;</span> ❤️
  </div>

  <!-- Merkezdeki Kalp Yapısı -->
  <div class="heart-container">
    <canvas id="heartCanvas" width="600" height="600"></canvas>
    
    <div class="center-text">
      <h1>ESİLA</h1>
      <p>Forever & Always</p>
    </div>
  </div>

  <!-- Alt Kısım: Kalp Ritmi (EKG) Çizgisi -->
  <div class="ecg-container">
    <svg class="ecg-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
      <path class="ecg-line" d="
        M 0,60 
        L 300,60 
        L 310,40 
        L 320,80 
        L 330,20 
        L 345,100 
        L 360,50 
        L 370,60 
        L 700,60 
        L 710,35 
        L 720,85 
        L 730,15 
        L 745,105 
        L 760,45 
        L 770,60 
        L 1200,60" 
      />
    </svg>
  </div>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    const width = canvas.width;
    const height = canvas.height;

    // İngilizce sevgi kelimeleri ve cümleleri
    const words = [
      "I LOVE YOU", "MY LOVE", "FOREVER", "ALWAYS", 
      "YOU ARE MY EVERYTHING", "SWEETHEART", "HONEY", 
      "BEAUTIFUL", "MY REASON", "I ADORE YOU", "YOU&ME", 
      "SOULMATE", "ENDLESS LOVE", "MY ANGEL", "I NEED YOU"
    ];

    // Kalp formülüne göre koordinat hesaplama
    function getHeartPoint(t) {
      // t: 0 - 2*PI arası
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      
      // Canvas merkezine ölçeklendirme ve taşıma
      return {
        x: width / 2 + x * 15,
        y: height / 2 + y * 15
      };
    }

    // Kalp çevresinde duracak kelimeleri hazırlama
    const totalItems = 70;
    const items = [];

    for (let i = 0; i < totalItems; i++) {
      const t = (i / totalItems) * Math.PI * 2;
      const pos = getHeartPoint(t);
      
      // Teğet açısını hesaplama (yazıların çizgi yönünde eğilmesi için)
      const delta = 0.01;
      const posNext = getHeartPoint(t + delta);
      const angle = Math.atan2(posNext.y - pos.y, posNext.x - pos.x);

      items.push({
        x: pos.x,
        y: pos.y,
        angle: angle,
        text: words[i % words.length],
        fontSize: Math.floor(Math.random() * 6) + 10, // 10px - 15px arası
        alpha: Math.random(),
        speed: 0.01 + Math.random() * 0.02,
        hue: Math.floor(Math.random() * 40) + 330 // Pembe-Kırmızı tonları
      });
    }

    // Parçacık efektleri (içeride ve dışarıda uçuşan parlak noktalar)
    const particles = [];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: width / 2 + (Math.random() - 0.5) * 300,
        y: height / 2 + (Math.random() - 0.5) * 300,
        size: Math.random() * 3 + 1,
        alpha: Math.random(),
        speedY: -(Math.random() * 0.8 + 0.2),
        speedX: (Math.random() - 0.5) * 0.5
      });
    }

    // Çizim ve Animasyon Döngüsü
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // 1. Kalbi oluşturan kelimeleri çiz
      items.forEach((item) => {
        // Opaklık değişimi (yanıp sönme / değişim efekti)
        item.alpha += item.speed;
        if (item.alpha > 1 || item.alpha < 0.2) {
          item.speed = -item.speed;
        }

        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.angle);
        
        ctx.font = `bold ${item.fontSize}px Arial`;
        ctx.fillStyle = `hsla(${item.hue}, 100%, 65%, ${item.alpha})`;
        ctx.shadowColor = `hsl(${item.hue}, 100%, 50%)`;
        ctx.shadowBlur = 8;
        
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.text, 0, 0);
        
        ctx.restore();
      });

      // 2. Uçuşan parlak pembe parçacıkları çizmeleri
      particles.forEach((p) => {
        p.y += p.speedY;
        p.x += p.speedX;
        p.alpha -= 0.005;

        if (p.alpha <= 0 || p.y < 50) {
          p.y = height / 2 + (Math.random() - 0.5) * 200;
          p.x = width / 2 + (Math.random() - 0.5) * 200;
          p.alpha = Math.random();
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 105, 180, ${p.alpha})`;
        ctx.shadowColor = "#ff2a75";
        ctx.shadowBlur = 6;
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
