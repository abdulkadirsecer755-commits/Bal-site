<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Esila</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0014;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #heart {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .love {
      position: absolute;
      color: #ff2d6a;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      text-shadow: 0 0 6px #ff2d6a, 0 0 12px #ff0066;
      animation: pulse 2.4s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
      will-change: transform, opacity;
    }

    .center-name {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 15;
      pointer-events: none;
    }

    .center-name .name {
      font-size: clamp(32px, 10vw, 56px);
      font-weight: 800;
      color: #fff;
      letter-spacing: 4px;
      text-shadow: 
        0 0 20px #ff2d6a,
        0 0 40px #ff0066,
        0 0 60px #cc0044;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.55;
        transform: translate(-50%, -50%) scale(0.92);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 18px #ff2d6a, 0 0 35px #ff0066;
      }
      to {
        text-shadow: 0 0 28px #ff2d6a, 0 0 55px #ff0066, 0 0 80px #cc0044;
      }
    }
  </style>
</head>
<body>

  <div id="heart"></div>

  <div class="center-name">
    <div class="name">Esila</div>
  </div>

  <script>
    const heart = document.getElementById('heart');
    const texts = ['I LOVE YOU', 'I LOVE YOU', 'LOVE', '❤'];

    function heartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    function getScale() {
      const minSide = Math.min(window.innerWidth, window.innerHeight);
      return Math.max(8, Math.min(15, minSide / 52));
    }

    function createHeart() {
      heart.innerHTML = '';
      const scale = getScale();
      const count = window.innerWidth < 500 ? 200 : 280;

      for (let i = 0; i < count; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t);
        const r = 0.52 + Math.random() * 0.55;

        const x = p.x * scale * r;
        const y = p.y * scale * r;

        const el = document.createElement('div');
        el.className = 'love';
        el.textContent = texts[Math.floor(Math.random() * texts.length)];

        el.style.left = `calc(50% + ${x}px)`;
        el.style.top  = `calc(50% + ${y}px)`;
        el.style.fontSize = (8 + Math.random() * 5.5) + 'px';
        el.style.animationDelay = (Math.random() * 2.4) + 's';
        el.style.animationDuration = (2.1 + Math.random() * 0.8) + 's';

        // Rastgele dönüş açısı (pulse içinde scale ile birlikte çalışsın diye ayrı tutuldu)
        el.style.setProperty('--rot', ((Math.random() - 0.5) * 40) + 'deg');
        el.style.transform = `translate(-50%, -50%) rotate(var(--rot))`;

        const hue = 335 + Math.random() * 35;
        el.style.color = `hsl(${hue}, 100%, 62%)`;
        el.style.textShadow = `0 0 7px hsl(${hue}, 100%, 50%)`;

        heart.appendChild(el);
      }
    }

    // Pulse animasyonunu rotation ile uyumlu hale getir
    const style = document.createElement('style');
    style.textContent = `
      @keyframes pulse {
        0%, 100% {
          opacity: 0.55;
          transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(0.92);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1.08);
        }
      }
    `;
    document.head.appendChild(style);

    createHeart();

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(createHeart, 180);
    });
  </script>
</body>
</html>
