<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESİLA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d000d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Sol Üst Köşe: Sonsuzluk ve Kalp */
    .top-left-icon {
      position: absolute;
      top: 30px;
      left: 30px;
      font-size: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
      color: #ff2a75;
      text-shadow: 0 0 12px #ff2a75, 0 0 25px #ff2a75;
      animation: glow 2.5s infinite alternate ease-in-out;
    }

    /* Ana Kalp Konteyneri ve Yavaş Yumuşak Atış */
    .heart-container {
      position: relative;
      width: 90vw;
      height: 80vh;
      max-width: 850px;
      max-height: 850px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: softHeartbeat 2s infinite ease-in-out;
    }

    @keyframes softHeartbeat {
      0% {
        transform: scale(1);
      }
      30% {
        transform: scale(1.05);
      }
      60% {
        transform: scale(0.98);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Canvas */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Kalbin Ortasındaki ESİLA Yazısı */
    .center-text {
      position: absolute;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }

    .center-text h1 {
      font-size: 82px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 6px;
      text-shadow: 
        0 0 15px #ff2a75,
        0 0 30px #ff2a75,
        0 0 45px #ff2a75,
        0 0 60px #ff0055;
      animation: pulseText 2.5s infinite alternate ease-in-out;
    }

    @keyframes pulseText {
      from {
        text-shadow: 0 0 15px #ff2a75, 0 0 25px #ff2a75, 0 0 35px #ff0055;
        transform: scale(1);
      }
      to {
        text-shadow: 0 0 25px #ff6699, 0 0 45px #ff2a75, 0 0 65px #ff0055, 0 0 85px #ff0055;
        transform: scale(1.03);
      }
    }

    /* Alt Kısım: Kalp Ritmi (EKG) Çizgisi */
    .ecg-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      overflow: hidden;
      z-index: 2;
    }

    .ecg-svg {
      width: 100%;
      height: 100%;
    }

    .ecg-line {
      fill: none;
      stroke: #ff2a75;
      stroke-width: 3.5;
      stroke-dasharray: 2400;
      stroke-dashoffset: 2400;
      animation: ecgDraw 3.5s linear infinite;
      filter: drop-shadow(0px 0px 10px #ff2a75);
    }

    @keyframes ecgDraw {
      0% {
        stroke-dashoffset: 2400;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes glow {
      from {
        opacity: 0.85;
        filter: drop-shadow(0 0 8px #ff2a75);
      }
      to {
        opacity: 1;
        filter: drop-shadow(0 0 20px #ff2a75);
      }
    }
  </style>
</head>
<body>

  <!-- Sol Üst: Sonsuzluk İşareti ve Kalp -->
  <div class="top-left-icon">
    <span>&#8734;</span> ❤️
  </div>

  <!-- Büyütülmüş Kalp Yapısı -->
  <div class="heart-container" id="heartContainer">
    <canvas id="heartCanvas"></canvas>
    
    <div class="center-text">
      <h1>ESİLA</h1>
    </div>
  </div>

  <!-- Alt Kısım: Kalp Ritmi (EKG) Çizgisi -->
  <div class="ecg-container">
    <svg class="ecg-svg" viewBox="0 0 1200 100" preserveAspectRatio="none">
      <path class="ecg-line" d="
        M 0,50 
        L 350,50 
        L 360,30 
        L 370,70 
        L 380,15 
        L 395,85 
        L 410,40 
        L 420,50 
        L 780,50 
        L 790,30 
        L 800,70 
        L 810,15 
        L 825,85 
        L 840,40 
        L 850,50 
        L 1200,50" 
      />
    </svg>
  </div>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('heartContainer');

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Kalbi oluşturacak İngilizce ifadeler
    const words = [
      "I LOVE YOU", "MY LOVE", "FOREVER", "ALWAYS", 
      "YOU ARE MY WORLD", "SWEETHEART", "I ADORE YOU", 
      "BEAUTIFUL", "YOU & ME", "SOULMATE", "ENDLESS LOVE", 
      "MY EVERYTHING", "MY ANGEL", "NEED YOU", "SPECIAL"
    ];

    // Büyütülmüş Kalp Formülü
    function getHeartPoint(t, scaleX, scaleY) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      
      return {
        x: canvas.width / 2 + x * scaleX,
        y: canvas.height / 2 + y * scaleY
      };
    }

    const totalItems = 85;
    const items = [];

    for (let i = 0; i < totalItems; i++) {
      items.push({
        t: (i / totalItems) * Math.PI * 2,
        text: words[i % words.length],
        fontSize: Math.floor(Math.random() * 4) + 14, // 14px - 17px Kalın ve büyük punto
        phase: Math.random() * Math.PI * 2, // Yumuşak geçiş için faz farkı
        speed: 0.02 + Math.random() * 0.015,
        hue: Math.floor(Math.random() * 30) + 335 // Parlak pembe-kırmızı tonları
      });
    }

    // Yüzen tatlı parlak noktalar
    const particles = [];
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 3 + 1,
        alpha: Math.random(),
        speedY: -(Math.random() * 0.6 + 0.2)
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Ekran boyutuna göre kalbin ölçeğini ayarlama (Büyük kalp)
      const scaleX = Math.min(canvas.width, canvas.height) / 32;
      const scaleY = scaleX;

      // 1. Kalbi oluşturan kalın ve yatay yazılar
      items.forEach((item) => {
        item.phase += item.speed;
        
        // Yumuşak geçişli opaklık (Sine wave)
        const alpha = 0.35 + (Math.sin(item.phase) + 1) * 0.32; 

        const pos = getHeartPoint(item.t, scaleX, scaleY);

        ctx.save();
        ctx.translate(pos.x, pos.y);
        // NOT: ctx.rotate KALDIRILDI -> Yazılar tamamen YATAY duruyor.

        ctx.font = `900 ${item.fontSize}px 'Segoe UI', sans-serif`;
        ctx.fillStyle = `hsla(${item.hue}, 100%, 70%, ${alpha})`;
        
        // Kalın ve belirgin görünüm için neon gölge
        ctx.shadowColor = `hsl(${item.hue}, 100%, 55%)`;
        ctx.shadowBlur = 12;
        
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.text, 0, 0);
        
        ctx.restore();
      });

      // 2. Parçacıklar
      particles.forEach((p) => {
        p.y += p.speedY;
        p.alpha -= 0.003;

        if (p.alpha <= 0 || p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
          p.alpha = Math.random();
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 80, 150, ${p.alpha})`;
        ctx.shadowColor = "#ff2a75";
        ctx.shadowBlur = 8;
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
