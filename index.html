<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herkes çiçek alır... Ben senin için kodladım.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0014;
      overflow: hidden;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Üst yazı */
    .top-text {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #fff;
      z-index: 10;
      text-shadow: 0 0 15px rgba(255, 100, 150, 0.8);
      font-size: clamp(18px, 4vw, 28px);
      line-height: 1.4;
      font-weight: 500;
      pointer-events: none;
    }

    .top-text span {
      display: block;
    }

    /* Kalp container */
    #heart {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .love {
      position: absolute;
      color: #ff2d6a;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      white-space: nowrap;
      text-shadow: 
        0 0 6px #ff2d6a,
        0 0 12px #ff0066,
        0 0 20px #cc0044;
      opacity: 0.85;
      animation: pulse 2.5s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }

    /* Ortadaki isim */
    .center-name {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(32px, 8vw, 56px);
      font-weight: 800;
      color: #fff;
      text-shadow: 
        0 0 20px #ff2d6a,
        0 0 40px #ff0066,
        0 0 60px #cc0044;
      z-index: 5;
      letter-spacing: 4px;
      animation: glow 2s ease-in-out infinite alternate;
    }

    .center-name small {
      display: block;
      font-size: 0.35em;
      font-weight: 400;
      letter-spacing: 2px;
      margin-top: 6px;
      opacity: 0.9;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes glow {
      from { text-shadow: 0 0 20px #ff2d6a, 0 0 40px #ff0066; }
      to   { text-shadow: 0 0 30px #ff2d6a, 0 0 60px #ff0066, 0 0 80px #cc0044; }
    }
  </style>
</head>
<body>

  <div class="top-text">
    <span>Herkes çiçek alır...</span>
    <span>Ben senin için kodladım.</span>
  </div>

  <div id="heart"></div>

  <div class="center-name">
    NAZ
    <small>senin için</small>
  </div>

  <script>
    const heart = document.getElementById('heart');
    const texts = ['I LOVE YOU', 'I LOVE YOU', 'I LOVE YOU', 'LOVE', '❤'];

    // Kalp formülü (parametrik)
    function heartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    // Kalp şeklini doldur
    const count = 280;          // yazı sayısı (daha yoğun için artır)
    const scale = 12;           // kalp boyutu

    for (let i = 0; i < count; i++) {
      const t = Math.random() * Math.PI * 2;
      const p = heartPoint(t);

      // biraz rastgelelik ekle (içini de doldursun)
      const r = 0.6 + Math.random() * 0.55;
      const x = p.x * scale * r;
      const y = p.y * scale * r;

      const el = document.createElement('div');
      el.className = 'love';
      el.textContent = texts[Math.floor(Math.random() * texts.length)];
      el.style.left = `calc(50% + ${x}px)`;
      el.style.top  = `calc(50% + ${y}px)`;
      el.style.transform = `translate(-50%, -50%) rotate(${(Math.random() - 0.5) * 40}deg)`;
      el.style.fontSize = (9 + Math.random() * 6) + 'px';
      el.style.animationDelay = (Math.random() * 2.5) + 's';
      el.style.opacity = 0.55 + Math.random() * 0.45;

      // renk varyasyonu
      const hue = 340 + Math.random() * 30;
      el.style.color = `hsl(${hue}, 100%, 60%)`;
      el.style.textShadow = `0 0 8px hsl(${hue}, 100%, 50%)`;

      heart.appendChild(el);
    }

    // Ortadaki ismi değiştirmek istersen:
    // document.querySelector('.center-name').innerHTML = 'SENİN İSMİN<br><small>senin için</small>';
  </script>
</body>
</html>
